<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Yi Lang's Snack Attack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#e5e1ef;--page-2:#d2cbe4;
  --ink:#1f1640;--ink-2:#5b5078;
  --panel:rgba(247,245,251,.95);--panel-solid:#f7f5fb;
  --edge:#c93a26;--edge-2:rgba(201,58,38,.28);
  --chip:rgba(247,245,251,.86);--chip-ink:#1f1640;
  --gold:#a8760f;--teal:#0f8a7a;--violet:#6b39d6;--red:#d33d27;
  --btn:#1f1640;--btn-ink:#f7f5fb;
  --track:rgba(31,22,64,.16);
  --shadow:0 .6em 1.8em rgba(31,22,64,.3);
  --font-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-brush:'Zen Antique','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0d0720;--page-2:#1d1142;
    --ink:#f3ecff;--ink-2:#b8aad8;
    --panel:rgba(26,16,54,.95);--panel-solid:#1b1138;
    --edge:#f3d38a;--edge-2:rgba(243,211,138,.3);
    --chip:rgba(16,9,36,.7);--chip-ink:#f3ecff;
    --gold:#f3d38a;--teal:#5fe3d0;--violet:#a57bff;--red:#ff5a44;
    --btn:#f3d38a;--btn-ink:#1b1138;
    --track:rgba(255,255,255,.14);
    --shadow:0 .6em 2em rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d0720;--page-2:#1d1142;
  --ink:#f3ecff;--ink-2:#b8aad8;
  --panel:rgba(26,16,54,.95);--panel-solid:#1b1138;
  --edge:#f3d38a;--edge-2:rgba(243,211,138,.3);
  --chip:rgba(16,9,36,.7);--chip-ink:#f3ecff;
  --gold:#f3d38a;--teal:#5fe3d0;--violet:#a57bff;--red:#ff5a44;
  --btn:#f3d38a;--btn-ink:#1b1138;
  --track:rgba(255,255,255,.14);
  --shadow:0 .6em 2em rgba(0,0,0,.6);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;overflow:hidden;background-color:var(--page);background-image:radial-gradient(90% 60% at 50% 0%,var(--page-2),transparent 70%),radial-gradient(60% 50% at 50% 100%,var(--page-2),transparent 70%);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#140c2e;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:16px;line-height:1.3;color:#f3ecff;font-family:var(--font-ui)}
@media (min-aspect-ratio:3/4){#stage{border-radius:.9em;box-shadow:var(--shadow),0 0 0 1px var(--edge-2)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:.18em solid var(--teal);outline-offset:.15em}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;left:.6em;right:.6em;top:.6em;display:flex;gap:.45em;align-items:stretch}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:.8em;box-shadow:0 .15em .6em rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ibtn{pointer-events:auto;border:0;cursor:pointer;width:2.8em;min-height:2.8em;display:grid;place-items:center;padding:0;font-weight:900}
.ibtn svg{width:1.15em;height:1.15em;fill:currentColor}
.wave{flex:1;padding:.45em .8em .55em;display:flex;flex-direction:column;justify-content:center;gap:.32em;min-width:0}
.wave-row{display:flex;align-items:baseline;gap:.4em;font-weight:900;white-space:nowrap}
.wave-row b{font-size:1.12em}
.wave-row span{opacity:.72;font-weight:700;font-size:.82em}
.wave-row em{margin-left:auto;font-style:normal;font-size:.78em;font-weight:700;opacity:.8;overflow:hidden;text-overflow:ellipsis}
.bar{height:.42em;border-radius:1em;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--red));transition:width .25s}
.bar-row{display:flex;align-items:center;gap:.5em;font-size:.72em;font-weight:900}
.bar-row .bar{flex:1;height:.6em}
.bar-row span:last-child{min-width:2.6em;text-align:right}
.bar.gold i{background:linear-gradient(90deg,#e8a030,#ffe08a)}
.bar.gold.low i{background:linear-gradient(90deg,#d0202a,#ff8a5a);animation:blink .5s ease-in-out infinite alternate}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',var(--font-ui);text-shadow:none!important;line-height:1}
.seal.emo{font-size:1.35em}
.card .seal.emo{font-size:1.45em;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 60%),var(--cc)}
.card .ty{font-size:.72em;font-weight:700;color:var(--ink-2)}
.card.r-common{box-shadow:inset 0 0 0 2px var(--cc),0 .35em 1.1em rgba(0,0,0,.4)}
.card.r-rare{box-shadow:inset 0 0 0 3px var(--cc),0 .35em 1.1em rgba(0,0,0,.4),0 0 1em rgba(79,163,255,.45)}
.card.r-epic,.card.r-legendary{border:.18em solid transparent;background-size:auto,320% 100%;animation:cardIn .42s both,shine 2.4s linear infinite}
.card.r-epic{background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,linear-gradient(115deg,#b56bff,#ff7ad8,#e8d0ff,#6b39d6,#b56bff) border-box;background-size:auto,320% 100%;box-shadow:0 0 1.3em rgba(181,107,255,.6)}
.card.r-legendary{background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,linear-gradient(115deg,#ffd66a,#ff6b4a,#fff3c2,#ffb020,#ffd66a) border-box;background-size:auto,320% 100%;box-shadow:0 0 1.8em rgba(255,200,80,.75)}
.tk.emo{font-size:1.02em}
.cbgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45em}
.cbf{display:flex;flex-direction:column;gap:.15em;font-size:.72em;font-weight:900;color:var(--ink-2)}
.cbf.wide{grid-column:span 3}
.cbf input,.cbf select,.cbcode{width:100%;box-sizing:border-box;font:inherit;font-size:1.15em;font-weight:700;color:var(--ink);background:var(--panel-solid);border:0;border-radius:.5em;padding:.4em .5em;box-shadow:inset 0 0 0 2px var(--edge-2);min-width:0}
.cbf input[type=color]{padding:.1em;height:2.2em}
.cbf.chk{flex-direction:row;align-items:center;gap:.4em;font-weight:700;color:var(--ink)}
.cbf.chk input{width:1.1em;height:1.1em;flex:none;box-shadow:none}
.cbfx{display:grid;grid-template-columns:1fr 1fr;gap:.3em .6em;margin-bottom:.5em}
.cbdesc{font-size:.8em;line-height:1.4;padding:.6em .7em;border-radius:.7em;box-shadow:inset 0 0 0 2px #8a4dff;background:rgba(138,77,255,.07)}
.cbcode{width:100%;min-height:3.6em;resize:vertical;font-family:monospace!important;font-size:.72em!important;word-break:break-all}
.cbup{padding:.5em .6em .6em;margin:.4em 0;border-radius:.8em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.cbup.tree{box-shadow:inset 0 0 0 2px #8a4dff}
.cbuph{display:flex;justify-content:space-between;align-items:center;font-size:.78em;margin-bottom:.3em}

.cbf.wide2{grid-column:span 2}
.cbrow{margin-top:.3em}
.cbtabs{display:flex;flex-wrap:wrap;gap:.3em;margin:.2em 0 .6em}
.cbtab{flex:1 1 30%;border:0;border-radius:.7em;padding:.5em .3em;font:inherit;font-size:.74em;font-weight:900;cursor:pointer;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge-2)}
.cbtab.on{background:#8a4dff;color:#fff;box-shadow:none}
.cbsec[hidden]{display:none}
.cbhelp{margin:.1em 0 .5em}

.cbr b{color:#8a4dff}
.cblook{width:100%;height:auto;border-radius:.8em;margin-bottom:.5em;display:block}
.cbfxl{display:grid;gap:.3em}
.cbfxr{display:grid;grid-template-columns:1fr 5.2em 5.2em;align-items:center;gap:.2em .5em;padding:.35em .5em;border-radius:.7em;box-shadow:inset 0 0 0 1.5px var(--edge-2)}
.cbfxr.on{box-shadow:inset 0 0 0 2px #8a4dff;background:rgba(138,77,255,.06)}
.cbfxr .cbfxd{grid-column:1;grid-row:2;font-size:.66em;color:var(--ink-2);font-weight:700}

.cbfxn input{width:100%;box-sizing:border-box;font:inherit;font-size:1.4em;font-weight:700;color:var(--ink);background:var(--panel-solid);border:0;border-radius:.4em;padding:.25em .3em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.cbfxr:not(.on) .cbfxn{opacity:.4}
.cbpow{margin-bottom:.4em}
.cbpbar{position:relative;height:.9em;border-radius:1em;background:rgba(138,128,160,.18);overflow:hidden}
.cbpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:1em;transition:width .2s}
.cbpbar span{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.cbpl{font-size:.72em;margin-top:.3em;line-height:1.35}
.cbtpl{display:grid;grid-template-columns:repeat(3,1fr);gap:.35em}
.cbtb{display:flex;flex-direction:column;align-items:center;gap:.1em;border:0;border-radius:.8em;padding:.5em .2em;font:inherit;font-size:.7em;font-weight:900;cursor:pointer;background:var(--panel-solid);color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge-2)}
.cbtb .emo{font-size:1.6em}
.cbtb:active{transform:scale(.96)}
.cbbar{position:sticky;bottom:-.2em;z-index:2;background:var(--panel-solid);padding:.4em 0;margin-top:.5em;box-shadow:0 -.6em .8em -.4em var(--panel-solid)}
.cb.onmine .cbdesc,.cb.onmine .cbbar{display:none}
.cbpool{display:block;width:100%;margin-top:.35em;border:0;border-radius:.6em;padding:.45em .6em;font:inherit;font-size:.74em;font-weight:800;text-align:left;cursor:pointer;background:rgba(138,128,160,.12);color:var(--ink)}
.cbpool.on{background:rgba(47,192,112,.14);box-shadow:inset 0 0 0 2px #2fc070}
.cbpool b{color:#1f9a5a}.cbpool:not(.on) b{color:var(--ink-2)}
.cbli .nm em{font-style:normal;font-size:.72em;font-weight:900;margin-left:.3em}
.t3col{display:flex;flex-direction:column;gap:.25em;padding:.4em;border-radius:.7em;box-shadow:inset 0 0 0 1.5px var(--edge-2);opacity:.75}
.t3col.on{opacity:1;box-shadow:inset 0 0 0 2px #8a4dff}
.t3col>b{font-size:.68em;color:var(--ink-2)}
.t3col .tn i{display:block;font-style:normal;font-weight:600;font-size:.85em;color:var(--ink-2)}
.uer.t3{background:rgba(138,77,255,.06);border-radius:.4em}
.uer.dim{opacity:.55}
.noupbar{display:flex;flex-wrap:wrap;align-items:center;gap:.4em;font-size:.74em;font-weight:800;padding:.5em .6em;margin:.3em 0;border-radius:.7em;background:rgba(232,53,42,.08);box-shadow:inset 0 0 0 2px #e8352a}
.noupbar .btn{min-height:1.9em;padding:.2em .6em;font-size:.95em}
.cbnext{margin:-.2em 0 .5em 1.1em;padding-left:.6em;border-left:3px solid #8a4dff}
.cbnext .cbup{box-shadow:inset 0 0 0 2px rgba(138,77,255,.45)}
.ueg{padding:.55em .65em;margin:.5em 0;border-radius:.9em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.ueh{display:flex;align-items:center;gap:.5em;margin-bottom:.35em}
.ueh .seal{width:1.9em;height:1.9em;font-size:1em}
.ueh b{flex:1;font-size:.86em}.ueh b i{font-style:normal;font-weight:700;color:var(--ink-2);font-size:.85em}
.uetot{font-size:.7em;font-weight:900;color:var(--ink-2)}
.uer{display:grid;grid-template-columns:1.6em 1fr 2.1em 3.2em 2.1em;align-items:center;gap:.3em;padding:.25em 0;border-top:1px solid var(--edge-2)}
.uen{font-size:.76em;font-weight:900;line-height:1.2}.uen i{display:block;font-style:normal;font-weight:600;color:var(--ink-2);font-size:.88em}
.uebt{height:2em;border:0;border-radius:.55em;font-size:1.05em;font-weight:900;cursor:pointer;background:var(--btn);color:var(--btn-ink)}
.uebt:disabled{opacity:.3;cursor:default}
.uel{text-align:center;font-size:.8em;color:var(--ink-2)}.uel.on{color:#1f9a5a}
.uet{display:flex;flex-wrap:wrap;align-items:center;gap:.3em;padding-top:.4em;border-top:1px solid var(--edge-2)}
.uetl{font-size:.72em;font-weight:900;margin-right:.2em}
.uetb{border:0;border-radius:1em;padding:.35em .7em;font-size:.72em;font-weight:900;cursor:pointer;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge-2)}
.uetb.on{background:#8a4dff;color:#fff;box-shadow:none}
.uebar{margin-top:.4em}.uebar .btn{min-height:2em;padding:.3em .7em;font-size:.74em}
.ueadd{align-items:stretch}.ueadd select{flex:1;min-width:0;font:inherit;font-size:.82em;font-weight:700;color:var(--ink);background:var(--panel-solid);border:0;border-radius:.6em;padding:.4em;box-shadow:inset 0 0 0 2px var(--edge-2)}.cbrow .btn{min-height:2em;padding:.3em .6em;font-size:.72em}
.newdot{display:inline-block;margin-left:.3em;padding:0 .4em;border-radius:1em;background:#e8352a;color:#fff;font-size:.72em;font-weight:900;animation:ready 1.4s ease-in-out infinite;--hc:#e8352a}
#bossbar.rage .bn b{color:#ff6a6a;animation:ready .8s ease-in-out infinite;--hc:#ff2a2a}
#bossbar.rage #bossFill,#bossbar.rage .fill{background:linear-gradient(90deg,#ff2a2a,#ff8a3a)!important}
@keyframes cardFlip{0%{opacity:0;transform:perspective(700px) rotateY(-80deg) translateY(.8em) scale(.9)}60%{opacity:1;transform:perspective(700px) rotateY(10deg) scale(1.02)}100%{opacity:1;transform:none}}
@keyframes cardPick{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(.2) translateY(-8em);opacity:0}}
@keyframes cardDrop{to{transform:translateY(3em) rotate(4deg);opacity:0}}
.lv .card{animation:cardFlip .5s cubic-bezier(.2,1.1,.4,1) both}
.lv .card.r-epic,.lv .card.r-legendary,.lv .card.r-mythic,.lv .card.r-cursed{animation:cardFlip .5s cubic-bezier(.2,1.1,.4,1) both,shine 2.4s linear infinite}
.lv .card:nth-of-type(2){animation-delay:.08s}.lv .card:nth-of-type(3){animation-delay:.16s}.lv .card:nth-of-type(4){animation-delay:.24s}
.lv .card.picked{animation:cardPick .26s ease-in both!important;box-shadow:0 0 2em var(--cc)}
.lv .card.drop{animation:cardDrop .22s ease-in both!important}
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;background:#140c2e;clip-path:circle(0% at 50% 55%);opacity:0}
#wipe.go{animation:iris .7s ease-in-out both}
@keyframes iris{0%{clip-path:circle(0% at 50% 55%);opacity:1}45%{clip-path:circle(80% at 50% 55%);opacity:1}100%{clip-path:circle(80% at 50% 55%);opacity:0}}
@media (prefers-reduced-motion:reduce){.lv .card,.lv .card.picked,.lv .card.drop{animation:none!important}#wipe.go{animation:none}}
.gim{display:block;margin-top:.3em;font-size:.7em;font-weight:900;color:#8a4dff;line-height:1.3}

.seal{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font-family:var(--font-brush);font-size:1.25em;line-height:1;color:#fff;background:var(--cc,#6b39d6);box-shadow:inset 0 0 0 .12em rgba(255,255,255,.45),inset 0 -.5em .8em rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.55)}

/* title */
.title{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto;grid-template-rows:1fr auto;padding:1.4em 1.25em 1.5em;pointer-events:none}
.title::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,5,24,.97) 0%,rgba(10,5,24,.82) 30%,rgba(10,5,24,0) 58%),linear-gradient(to left,rgba(10,5,24,.5),transparent 35%)}
.vt{position:relative;grid-column:2;grid-row:1;writing-mode:vertical-rl;font-family:var(--font-brush);font-size:5em;line-height:1.02;color:#f3d38a;text-shadow:0 0 .22em rgba(243,211,138,.5),0 .05em 0 #3b1a0e;align-self:start;margin-top:1.2em;animation:inkIn 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes inkIn{from{opacity:0;filter:blur(8px);transform:translateY(-.25em)}to{opacity:1;filter:none;transform:none}}
.tmain{position:relative;grid-column:1/3;grid-row:2;pointer-events:auto;color:#f3ecff}
.hanko{position:absolute;right:.1em;top:-4.2em;width:2.6em;height:2.6em;display:grid;place-items:center;font-family:var(--font-brush);font-size:1.25em;color:#fff3e8;background:#c9321f;border-radius:.3em;transform:rotate(-7deg);box-shadow:inset 0 0 0 .12em rgba(255,240,230,.55),0 .2em .6em rgba(0,0,0,.5);animation:stamp .5s .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(-7deg)}}
.tmain h1{margin:0;font-family:var(--font-brush);font-weight:400;font-size:2.7em;line-height:1;color:#fff}
.tmain p{margin:.45em 0 1em;color:#ddd1f6;font-size:.95em;line-height:1.5;max-width:23em}
.tmain .btn.primary{width:100%}
.tmain .btn.ghost{color:#f3ecff;box-shadow:inset 0 0 0 2px rgba(243,211,138,.35)}
.tmeta{margin-top:.85em;display:flex;justify-content:space-between;gap:1em;font-size:.8em;color:#cabfe6}
.savechip{margin:.45em 0 .1em;font-size:.8em;font-weight:700;color:#bff4e8;text-align:center}
.toggles{display:flex;gap:.4em;margin-top:.7em;flex-wrap:wrap}
.tog{pointer-events:auto;border:0;cursor:pointer;border-radius:2em;padding:.45em .8em;font-size:.78em;font-weight:700;background:rgba(255,255,255,.08);color:#e9e0ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tog[aria-pressed="true"]{background:rgba(95,227,208,.2);box-shadow:inset 0 0 0 1px rgba(95,227,208,.6);color:#fff}
.sheet .tog{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge-2)}
.sheet .tog[aria-pressed="true"]{background:var(--edge-2)}

/* level-up cards */
.lv{width:100%;display:flex;flex-direction:column;gap:.65em}
.lv-head{text-align:center;margin-bottom:.2em}
.lv-head b{display:block;font-family:var(--font-brush);font-weight:400;font-size:2.4em;line-height:1.05;color:#f3d38a;text-shadow:0 0 .35em rgba(243,211,138,.6)}
.lv-head span{font-weight:900;color:#fff;font-size:1.02em}
.lv-head small{font-weight:700;opacity:.75}
.card{position:relative;display:grid;grid-template-columns:3.4em 1fr;gap:.85em;align-items:center;width:100%;padding:.85em .95em;border:0;border-radius:1em;background:var(--panel-solid);color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 2px var(--cc),0 .35em 1.1em rgba(0,0,0,.4);animation:cardIn .42s cubic-bezier(.2,.9,.25,1.12) both;transition:transform .12s}
.card:nth-of-type(2){animation-delay:.07s}.card:nth-of-type(3){animation-delay:.14s}
.card:hover,.card:focus-visible{transform:translateY(-.14em)}
.card .seal{width:2.72em;height:2.72em;font-size:1.25em}
.card.charm .seal{border-radius:.55em}
.cb{display:flex;flex-direction:column;gap:.28em;min-width:0}
.ct{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.ct b{font-size:1.02em;font-weight:900}
.ct em{font-style:normal;font-size:.72em;font-weight:900;padding:.1em .55em;border-radius:1em;background:var(--cc);color:#150b2c}
.cd{font-size:.84em;line-height:1.4;color:var(--ink-2)}
.pips{display:flex;gap:.2em}
.pips i{width:.95em;height:.32em;border-radius:.2em;background:var(--track)}
.pips i.on{background:var(--cc)}
.pips i.nx{background:var(--cc);animation:blink .7s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.25}to{opacity:1}}
.card.evo{background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,linear-gradient(115deg,#ffd66a,#ff6b4a,#fff3c2,#8a4dff,#ffd66a) border-box;background-size:auto,320% 100%;border:.16em solid transparent;box-shadow:0 0 1.4em rgba(255,214,106,.55);animation:cardIn .42s both,shine 2.4s linear infinite}
@keyframes shine{to{background-position:0 0,320% 0}}
@keyframes cardIn{from{opacity:0;transform:translateY(1.1em) scale(.97)}to{opacity:1;transform:none}}
.lv .btn.ghost{color:#f3ecff;box-shadow:inset 0 0 0 2px rgba(243,211,138,.35);background:rgba(10,5,24,.4)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:2.6em 1fr auto;gap:.75em;align-items:center;padding:.65em 0;border-bottom:1px solid var(--edge-2)}
.li:last-child{border-bottom:0}
.li .seal{width:2.1em;height:2.1em;font-size:1.25em}
.li .nm{font-weight:900;font-size:.95em}
.li .ds{font-size:.8em;color:var(--ink-2);line-height:1.4;margin-top:.1em}
.li .pp{display:flex;gap:.18em;margin-top:.3em}
.li .pp i{width:.8em;height:.3em;border-radius:.2em;background:var(--track)}
.li .pp i.on{background:var(--gold)}
.li .btn{min-height:2.4em;padding:.5em .8em;font-size:.82em;white-space:nowrap}
.sec{margin:1.1em 0 .3em;font-size:.85em;font-weight:900;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin:.9em 0}
.stat{border-radius:.8em;padding:.6em .5em;text-align:center;box-shadow:inset 0 0 0 2px var(--edge-2)}
.stat b{display:block;font-size:1.25em;font-weight:900}
.stat span{font-size:.72em;color:var(--ink-2)}
.dmg{display:flex;flex-direction:column;gap:.45em}
.dr{display:grid;grid-template-columns:7.4em 1fr 3.2em;gap:.5em;align-items:center;font-size:.8em}
.dr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.dr .db{height:.55em;border-radius:1em;background:var(--track);overflow:hidden}
.dr .db i{display:block;height:100%;border-radius:inherit;background:var(--cc)}
.dr span:last-child{text-align:right;font-weight:900}
.res-k{font-family:var(--font-brush);font-size:2.6em;line-height:1;color:var(--edge)}
.help p{margin:.5em 0;line-height:1.55;font-size:.9em}
.help b{font-weight:900}
.kbd{display:inline-block;padding:0 .4em;border-radius:.35em;box-shadow:inset 0 0 0 1.5px var(--edge-2);font-weight:900;font-size:.85em}

@media (prefers-reduced-motion:reduce){
  #banner.show{animation:bannerFade 2.5s linear forwards}
  @keyframes bannerFade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
  .card,.card.evo,.vt,.hanko{animation:none}
  .ult.ready .ring{animation:none;box-shadow:0 0 1em var(--hc)}
  .pips i.nx{animation:none}
}
</style>
</head>

<div id="app"><div id="stage">
<canvas id="cv" role="img" aria-label="Snack Attack battlefield"></canvas>
<div id="hud" class="hidden">
  <div class="top">
    <button class="ibtn chip" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>
    <div class="chip wave"><div class="wave-row"><b id="wLabel">Wave 1</b><span id="wOf">of 30</span><em id="wKills">0 popped</em></div><div class="bar"><i id="wBar"></i></div><div class="bar-row"><span>Barrier</span><div class="bar gold"><i id="bBar"></i></div><span id="bTxt">1200</span></div></div>
    <button class="ibtn chip" id="bSpeed" aria-label="Toggle game speed"><span id="spdTxt">1×</span></button>

};
const DAILY_RULE_IDS = Object.keys(DAILY_RULES);
function seededRng(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  let a = h >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function makeDaily(key) {
  const R = seededRng('yilang-daily-' + key), pk = a => a[Math.floor(R() * a.length)];
  const ruleId = pk(DAILY_RULE_IDS), hero = pk(HERO_IDS), bp = ['gasha', 'nue', 'orochi', 'golem', 'queen', 'titan', 'colossus', 'garlord'];
  const D = { name: 'Daily challenge', jp: '日替', icon: '🗓️', waves: 20, hp: 1.05, dmg: 1.05, spd: 1, count: 1, elite: 0.05, bosses: [pk(bp), pk(bp), pk(bp), pk(bp)],
    pool: pk([{}, { wall: 2, spider: 1.6 }, { crow: 2.5, kasa: 2 }, { shroom: 2, spud: 2 }, { garlic: 1.6, oni: 1.6 }, { lantern: 2 }]), tint: '#2fc0a0', tintA: 0.08, reward: 400, hero, ruleId, key };
  if (ruleId === 'fast') D.spd = 1.4;
  if (ruleId === 'elite') D.elite = 0.3;
  if (ruleId === 'swarm') { D.count = 1.5; D.hp = 0.72; }
  D.rule = DAILY_RULES[ruleId].name + ': ' + DAILY_RULES[ruleId].desc;
  return D;
}

/* ============ Night Parade: art ============ */
const OL = '#1c0f24';
const SPR_RES = 2;
function sprite(w, h, ax, ay, fn, res = SPR_RES) {
  const c = mkCanvas(w * res, h * res); const g = c.getContext('2d');
  g.scale(res, res); g.translate(ax, ay); g.lineJoin = 'round'; g.lineCap = 'round';

/* the Look tab's live preview: three projectiles in flight and an explosion */

function cbSave() {

  _cbEdit = null; _cbTab = 'basics'; showBuilder(Object.assign(cbClean(c.spec), { name: (c.spec.name + ' copy').slice(0, 28) }), null); toast('Duplicated: save it to keep the copy');

/* saved custom attacks show up on level-up cards unless switched off (never in the daily challenge) */
function customPoolIds() {
  if (G.daily || G.demo) return [];
  return (SAVE.customs || []).filter(c => c.pool !== false).map(c => 'cx_' + c.uid).filter(id => TECHS[id]);
}

/* short, capped pop-ups so big blasts don't flood the screen */
function custPop(e, txt, col) {
  if ((G.cpopT || 0) > G.time) return; G.cpopT = G.time + 0.12;
  fxPush({ k: 'text', x: e.x, y: e.y - e.r * depthS(e.y) * 2 - 10, txt, font: '900 16px ' + UIFONT, color: col, dur: 0.7, rise: 26, stroke: 5 });
}
/* ============ Night Parade: boot & loop ============ */
let lastT = 0, perfAcc = 0, perfN = 0, resizeTimer = 0;
function resize() {
  const app = $('app'), stage = $('stage');
  const aw = app.clientWidth || window.innerWidth, ah = app.clientHeight || window.innerHeight;
  let sw = aw, sh = aw * H / W; if (sh > ah) { sh = ah; sw = ah * W / H; }
  sw = Math.max(200, Math.floor(sw)); sh = Math.max(356, Math.floor(sh));
  stage.style.width = sw + 'px'; stage.style.height = sh + 'px'; stage.style.fontSize = (sw / 36) + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, SAVE.settings.quality === 'low' ? 1 : 2);

function perfTrack(dt) {

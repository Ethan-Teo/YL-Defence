<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140c2e">
<title>Yi Lang's Snack Attack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#e5e1ef;--page-2:#d2cbe4;
  --ink:#1f1640;--ink-2:#5b5078;
  --panel:rgba(247,245,251,.95);--panel-solid:#f7f5fb;
  --edge:#c93a26;--edge-2:rgba(201,58,38,.28);
  --chip:rgba(247,245,251,.86);--chip-ink:#1f1640;
  --gold:#a8760f;--teal:#0f8a7a;--violet:#6b39d6;--red:#d33d27;
  --btn:#1f1640;--btn-ink:#f7f5fb;
  --track:rgba(31,22,64,.16);
  --shadow:0 .6em 1.8em rgba(31,22,64,.3);
  --font-ui:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP','Noto Sans CJK JP',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-brush:'Zen Antique','Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','Noto Serif CJK JP',serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0d0720;--page-2:#1d1142;
    --ink:#f3ecff;--ink-2:#b8aad8;
    --panel:rgba(26,16,54,.95);--panel-solid:#1b1138;
    --edge:#f3d38a;--edge-2:rgba(243,211,138,.3);
    --chip:rgba(16,9,36,.7);--chip-ink:#f3ecff;
    --gold:#f3d38a;--teal:#5fe3d0;--violet:#a57bff;--red:#ff5a44;
    --btn:#f3d38a;--btn-ink:#1b1138;
    --track:rgba(255,255,255,.14);
    --shadow:0 .6em 2em rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#0d0720;--page-2:#1d1142;
  --ink:#f3ecff;--ink-2:#b8aad8;
  --panel:rgba(26,16,54,.95);--panel-solid:#1b1138;
  --edge:#f3d38a;--edge-2:rgba(243,211,138,.3);
  --chip:rgba(16,9,36,.7);--chip-ink:#f3ecff;
  --gold:#f3d38a;--teal:#5fe3d0;--violet:#a57bff;--red:#ff5a44;
  --btn:#f3d38a;--btn-ink:#1b1138;
  --track:rgba(255,255,255,.14);
  --shadow:0 .6em 2em rgba(0,0,0,.6);
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;height:100%;overflow:hidden;background-color:var(--page);background-image:radial-gradient(90% 60% at 50% 0%,var(--page-2),transparent 70%),radial-gradient(60% 50% at 50% 100%,var(--page-2),transparent 70%);color:var(--ink);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#140c2e;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:16px;line-height:1.3;color:#f3ecff;font-family:var(--font-ui)}
@media (min-aspect-ratio:3/4){#stage{border-radius:.9em;box-shadow:var(--shadow),0 0 0 1px var(--edge-2)}}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:.18em solid var(--teal);outline-offset:.15em}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;left:.6em;right:.6em;top:.6em;display:flex;gap:.45em;align-items:stretch}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:.8em;box-shadow:0 .15em .6em rgba(0,0,0,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ibtn{pointer-events:auto;border:0;cursor:pointer;width:2.8em;min-height:2.8em;display:grid;place-items:center;padding:0;font-weight:900}
.ibtn svg{width:1.15em;height:1.15em;fill:currentColor}
.wave{flex:1;padding:.45em .8em .55em;display:flex;flex-direction:column;justify-content:center;gap:.32em;min-width:0}
.wave-row{display:flex;align-items:baseline;gap:.4em;font-weight:900;white-space:nowrap}
.wave-row b{font-size:1.12em}
.wave-row span{opacity:.72;font-weight:700;font-size:.82em}
.wave-row em{margin-left:auto;font-style:normal;font-size:.78em;font-weight:700;opacity:.8;overflow:hidden;text-overflow:ellipsis}
.bar{height:.42em;border-radius:1em;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--violet),var(--red));transition:width .25s}
.bar-row{display:flex;align-items:center;gap:.5em;font-size:.72em;font-weight:900}
.bar-row .bar{flex:1;height:.6em}
.bar-row span:last-child{min-width:2.6em;text-align:right}
.bar.gold i{background:linear-gradient(90deg,#e8a030,#ffe08a)}
.bar.gold.low i{background:linear-gradient(90deg,#d0202a,#ff8a5a);animation:blink .5s ease-in-out infinite alternate}
.emo{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',var(--font-ui);text-shadow:none!important;line-height:1}
.seal.emo{font-size:1.35em}
.card .seal.emo{font-size:1.45em;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 60%),var(--cc)}
.card .ty{font-size:.72em;font-weight:700;color:var(--ink-2)}
.card.r-common{box-shadow:inset 0 0 0 2px var(--cc),0 .35em 1.1em rgba(0,0,0,.4)}
.card.r-rare{box-shadow:inset 0 0 0 3px var(--cc),0 .35em 1.1em rgba(0,0,0,.4),0 0 1em rgba(79,163,255,.45)}
.card.r-epic,.card.r-legendary{border:.18em solid transparent;background-size:auto,320% 100%;animation:cardIn .42s both,shine 2.4s linear infinite}
.card.r-epic{background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,linear-gradient(115deg,#b56bff,#ff7ad8,#e8d0ff,#6b39d6,#b56bff) border-box;background-size:auto,320% 100%;box-shadow:0 0 1.3em rgba(181,107,255,.6)}
.card.r-legendary{background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,linear-gradient(115deg,#ffd66a,#ff6b4a,#fff3c2,#ffb020,#ffd66a) border-box;background-size:auto,320% 100%;box-shadow:0 0 1.8em rgba(255,200,80,.75)}
.tk.emo{font-size:1.02em}
.story .sty-t{font-family:var(--font-brush);font-size:1.3em;text-align:center;margin-bottom:.5em}
.sty-p{display:flex;align-items:flex-end;gap:.6em;min-height:9em}
.sty-p.r{flex-direction:row-reverse}
.sf{width:6.5em;height:6.5em;flex:none;object-fit:contain}
.sf.hero{border-radius:50%;box-shadow:0 0 0 .2em #ffcf5a}
.bub{position:relative;flex:1;padding:.7em .9em;border-radius:1em;background:var(--panel-solid);box-shadow:inset 0 0 0 2px var(--edge-2);animation:cardIn .3s both}
.bub b{display:block;font-size:.8em;color:#c93a26}
.bub p{margin:.2em 0 0;font-size:.92em;line-height:1.4}
.sty-d{display:flex;justify-content:center;gap:.35em;margin:.8em 0 .2em}
.sty-d i{width:.5em;height:.5em;border-radius:50%;background:var(--track)}
.sty-d i.on{background:#c93a26}
.stars3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em;margin:.2em 0 .6em}
.st3{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15em;padding:.45em .3em;border-radius:.8em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.st3 b{font-size:1.6em;line-height:1;color:#b8b0c8}
.st3.on b{color:#f0b020;text-shadow:0 0 .5em rgba(255,200,40,.7)}
.st3 span{font-size:.62em;line-height:1.25;color:var(--ink-2);font-weight:700}
.chstars{display:inline-flex;gap:.05em;margin-left:auto}
.chstars i{font-style:normal;color:#c8c0d8;font-size:.9em}
.chstars i.on{color:#f0b020}
.hxp{display:flex;align-items:center;gap:.6em;padding:.5em .7em;border-radius:.8em;margin-bottom:.6em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.hxp.up{box-shadow:inset 0 0 0 2px #f0b020,0 0 1em rgba(255,200,40,.35)}
.hxp img{width:2.6em;height:2.6em;border-radius:50%}
.hxp b{display:block;font-size:.85em}
.hxp span{font-size:.72em;color:var(--ink-2);line-height:1.3}
.crewline{display:flex;align-items:center;gap:.6em;padding:.55em .7em;border-radius:.9em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.crewline img{width:2.8em;height:2.8em;border-radius:50%}
.crewline div{flex:1}
.crewline b{display:block;font-size:.86em}
.crewline span{font-size:.72em;color:var(--ink-2)}
.crewline .btn{min-height:2.2em;padding:.4em .8em;font-size:.8em}
.hbar{height:.5em;border-radius:1em;background:var(--track);overflow:hidden;margin:.2em 0 .3em}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf5a,#ff7a2a)}
.perks{list-style:none;margin:.4em 0;padding:0;display:grid;gap:.2em;font-size:.74em}
.perks li{color:var(--ink-2);opacity:.6}
.perks li.on{opacity:1;color:var(--ink)}
.perks li.on b{color:#1f9a5a}
.ofs{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.ofs.pets{grid-template-columns:repeat(2,1fr)}
.of{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15em;padding:.5em .3em;border:0;border-radius:.8em;background:transparent;color:var(--ink);cursor:pointer;box-shadow:inset 0 0 0 2px var(--edge-2);font:inherit}
.of i{width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.1em;box-shadow:0 0 0 2px rgba(0,0,0,.2)}
.of b{font-size:.74em}
.of span{font-size:.66em;color:var(--ink-2);font-weight:700}
.of .pd{font-weight:400;line-height:1.25}
.of.on{box-shadow:inset 0 0 0 2.5px #2fc070,0 0 .8em rgba(47,192,112,.4)}
.of:disabled{opacity:.45;cursor:not-allowed}
.tk.idle{opacity:.38;filter:grayscale(.7)}
.sbr{display:flex;justify-content:space-around;gap:.4em;margin:.2em 0 .4em;font-size:.72em;font-weight:900}
.sbr span{color:var(--bc)}
.stree{position:relative;margin:0 -.4em}
.stree svg{position:absolute;inset:0;width:100%;height:100%}
.sn{position:absolute;transform:translateX(-50%);width:5.4em;display:flex;flex-direction:column;align-items:center;gap:.1em;border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.sn-i{width:2.6em;height:2.6em;display:grid;place-items:center;font-size:1.25em;border-radius:50%;background:var(--panel-solid);box-shadow:inset 0 0 0 2.5px var(--bc,#8a80a0),0 .15em .4em rgba(0,0,0,.25);transition:transform .12s}
.sn-n{font-size:.62em;font-weight:900;line-height:1.15;text-align:center}
.sn-l{position:absolute;top:1.85em;left:50%;transform:translateX(.7em);font-size:.6em;font-weight:900;padding:.05em .4em;border-radius:1em;background:#1b1138;color:#fff}
.sn.locked{opacity:.45}
.sn.locked .sn-i{box-shadow:inset 0 0 0 2px #8a80a0;filter:grayscale(1)}
.sn.owned .sn-i{background:radial-gradient(circle at 35% 30%,#ffffff,var(--bc));box-shadow:inset 0 0 0 2.5px var(--bc),0 0 .7em var(--bc)}
.sn.max .sn-i{background:radial-gradient(circle at 35% 30%,#fff6c8,#e0a020);box-shadow:inset 0 0 0 2.5px #b8860b,0 0 .9em #ffc24a}
.sn.max .sn-l{background:#b8860b}
.sn.open.afford .sn-i,.sn.owned.afford .sn-i{animation:ready 1.3s ease-in-out infinite;--hc:var(--bc)}
.sn.sel .sn-i{transform:scale(1.14);outline:3px solid var(--ink);outline-offset:2px}
.sn.root{cursor:default}
.sn.root .sn-i{background:radial-gradient(circle at 35% 30%,#fff6c8,#ff9a4a);box-shadow:inset 0 0 0 2.5px #c93a26}
.sdet{display:grid;grid-template-columns:2.6em 1fr auto;gap:.6em;align-items:center;padding:.7em;border-radius:.9em;margin-top:.4em;box-shadow:inset 0 0 0 2px var(--bc)}
.sdet .seal{width:2.2em;height:2.2em;font-size:1.2em}
.sdet .nm{font-weight:900}
.sdet em{font-style:normal;font-size:.72em;color:var(--ink-2);font-weight:700}
.sdet .btn{min-height:2.5em;padding:.5em .9em;font-size:.85em}
.sreq{color:#c93a26!important;font-weight:700}
.sreason{grid-column:3;text-align:center;font-size:.65em!important}
@media (prefers-reduced-motion:reduce){.sn.open.afford .sn-i,.sn.owned.afford .sn-i{animation:none}}
.card.r-cursed{background:linear-gradient(#2a0a14,#2a0a14) padding-box,linear-gradient(115deg,#c81a3a,#3a0a14,#ff4a6a,#c81a3a) border-box;background-size:auto,320% 100%;border:.18em solid transparent;color:#ffe8ee;box-shadow:0 0 1.4em rgba(200,26,58,.6);animation:cardIn .42s both,shine 2s linear infinite}
.card.r-cursed .cd,.card.r-cursed .ty{color:#ffb8c8}
.tk.r-cursed{box-shadow:0 0 0 .14em #c81a3a,0 0 .7em rgba(200,26,58,.9)}
.tip{position:absolute;left:.8em;right:.8em;top:9.8em;z-index:6;display:flex;align-items:center;gap:.6em;padding:.7em .8em;border-radius:.9em;background:var(--panel);color:var(--ink);box-shadow:var(--shadow),0 0 0 2px #2fc070;font-size:.86em;line-height:1.4;animation:cardIn .35s both}
.tip-i{font-size:1.5em}
.tip-t{flex:1}
.tip-b{border:0;border-radius:.7em;padding:.5em .8em;font-weight:900;background:#2fc070;color:#fff;cursor:pointer}
.heroes{display:grid;grid-template-columns:repeat(2,1fr);gap:.5em}
.hc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.2em;padding:.6em .5em;border-radius:.9em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.hc img{width:3.4em;height:3.4em;border-radius:50%;box-shadow:0 0 0 .16em var(--hc)}
.hc b{font-size:.86em}
.hc span{font-size:.7em;color:var(--ink-2);line-height:1.3}
.hc .hu{font-weight:900}
.hc .hr{font-size:.64em}
.hc em{font-style:normal;font-size:.72em;font-weight:900;color:#1f9a5a;margin-top:.2em}
.hc .btn{min-height:2.1em;padding:.35em .8em;font-size:.76em;margin-top:.2em}
.hc.sel{box-shadow:inset 0 0 0 2.5px var(--hc),0 0 1em var(--hc)}
.hc.locked img{filter:grayscale(1) brightness(.6)}
.tabs{display:flex;gap:.4em;margin-bottom:.6em}
.tab{flex:1;border:0;border-radius:.7em;padding:.55em;font-weight:900;cursor:pointer;background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge-2)}
.tab.on{background:var(--btn);color:var(--btn-ink)}
.dex{display:grid;grid-template-columns:repeat(2,1fr);gap:.5em}
.dx{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.15em;padding:.5em;border-radius:.8em;box-shadow:inset 0 0 0 2px var(--edge-2)}
.dx img{width:4.6em;height:4.6em}
.dx b{font-size:.82em}
.dx em{font-style:normal;font-size:.62em;font-weight:900;padding:.05em .5em;border-radius:1em;background:#c93a26;color:#fff}
.dx span{font-size:.66em;color:var(--ink-2);line-height:1.3}
.dx i{font-style:normal;font-size:.66em;font-weight:900}
.dx.unseen{opacity:.6}
.achbar{height:.4em;border-radius:1em;background:var(--track);overflow:hidden;margin-top:.35em}
.achbar i{display:block;height:100%;background:#e0a020}
.li.ach.done .nm{color:#b8860b}
.chc{display:grid;grid-template-columns:2.6em 1fr auto;gap:.7em;align-items:center;padding:.7em;margin:.5em 0;border-radius:.9em;box-shadow:inset 0 0 0 2px var(--edge-2),inset .35em 0 0 var(--ct)}
.chc.cleared{box-shadow:inset 0 0 0 2px #2fc070,inset .35em 0 0 var(--ct)}
.chc.locked{opacity:.5}
.chi{width:2.2em;height:2.2em;display:grid;place-items:center;font-size:1.3em;border-radius:.6em;background:var(--ct);box-shadow:inset 0 -.3em .5em rgba(0,0,0,.25)}
.chn{display:flex;align-items:baseline;gap:.45em;flex-wrap:wrap}
.chn b{font-size:.95em}
.chk{font-family:var(--font-brush);font-size:.8em;color:var(--ink-2)}
.chok{color:#1f9a5a;font-weight:900}
.chm{display:flex;align-items:center;gap:.5em;font-size:.74em;font-weight:900;color:var(--ink-2);margin:.15em 0}
.sk{display:inline-flex;gap:.15em}
.sk i{width:.7em;height:.7em;border-radius:50%;background:var(--track)}
.sk i.on{background:#e8352a}
.chr{font-size:.76em;line-height:1.35}
.chs{font-size:.7em;font-weight:700;color:var(--ink-2);margin-top:.2em}
.chp{min-height:2.4em;padding:.5em .9em;font-size:.85em}
.card.treecard .ty{color:#1f9a5a}
.tree{border-radius:.9em;padding:.75em;margin:.6em 0;box-shadow:inset 0 0 0 2px var(--edge-2)}
.tr-h{display:flex;align-items:center;gap:.55em;font-size:1.02em}
.tr-h .seal{width:2em;height:2em;font-size:1.15em}
.tr-m{margin-left:auto;font-size:.68em;font-weight:900;padding:.15em .55em;border-radius:1em;background:#ff4d8a;color:#fff}
.tr-lbl{margin:.55em 0 .3em;font-size:.68em;font-weight:900;color:var(--ink-2)}
.tr-t1{display:flex;flex-wrap:wrap;gap:.3em}
.tn{font-size:.72em;font-weight:700;padding:.3em .55em;border-radius:.6em;box-shadow:inset 0 0 0 1.5px var(--rc);opacity:.6}
.tn.own{opacity:1;background:var(--rc);color:#150b2c}
.tn b{font-weight:900}
.tr-link{display:flex;align-items:center;gap:.5em;margin:.5em 0 0;font-size:.7em;font-weight:700;color:var(--ink-2)}
.tr-link i{width:.3em;height:1.6em;border-radius:1em;background:var(--track)}
.tr-link.on i{background:#2fc070;box-shadow:0 0 .5em #2fc070}
.tr-link.on span{color:#1f9a5a}
.tr-fork{display:grid;grid-template-columns:1fr auto 1fr;gap:.4em;align-items:stretch}
.tr-or{align-self:center;font-size:.7em;font-weight:900;color:var(--ink-2)}
.tf{border-radius:.7em;padding:.5em .55em;box-shadow:inset 0 0 0 2px var(--track);display:flex;flex-direction:column;gap:.25em}
.tf-h{display:flex;gap:.35em;align-items:center;font-size:.8em}
.tf-d{font-size:.68em;line-height:1.35;color:var(--ink-2)}
.tf em{margin-top:auto;font-style:normal;font-size:.62em;font-weight:900;color:var(--ink-2)}
.tf.owned{box-shadow:inset 0 0 0 2.5px #b56bff,0 0 .9em rgba(181,107,255,.5);background:rgba(181,107,255,.12)}
.tf.owned em{color:#b56bff}
.tf.open{box-shadow:inset 0 0 0 2px #2fc070}
.tf.open em{color:#1f9a5a}
.tf.locked{opacity:.4;text-decoration:line-through}
.tf.need,.tf.noattack{opacity:.72}
.card.r-mythic{border:.2em solid transparent;background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,linear-gradient(115deg,#ff4d8a,#ffd66a,#5fe3d0,#8a4dff,#ff4d8a) border-box;background-size:auto,320% 100%;box-shadow:0 0 2em rgba(255,77,138,.7);animation:cardIn .42s both,shine 1.6s linear infinite}
.card.r-mythic .seal{background:conic-gradient(#ff4d8a,#ffd66a,#5fe3d0,#8a4dff,#ff4d8a)}
.tk.r-mythic{box-shadow:0 0 0 .15em #ff4d8a,0 0 .9em rgba(255,77,138,.9)}
.tk.r-epic{box-shadow:0 0 0 .14em #b56bff,0 0 .7em rgba(181,107,255,.8)}
.tk.r-legendary{box-shadow:0 0 0 .14em #ffc24a,0 0 .8em rgba(255,194,74,.9)}
#techs{position:absolute;left:.6em;top:5.6em;display:flex;gap:.28em;flex-wrap:wrap;max-width:70%}
.tk{position:relative;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;font-family:var(--font-brush);font-size:1em;line-height:1;color:#fff;background:var(--tc);box-shadow:inset 0 0 0 .12em rgba(255,255,255,.4),inset 0 -.4em .6em rgba(0,0,0,.35),0 .12em .35em rgba(0,0,0,.5);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tk i{position:absolute;right:-.3em;bottom:-.25em;min-width:1.25em;height:1.25em;padding:0 .2em;border-radius:1em;font-style:normal;font-family:var(--font-ui);font-weight:900;font-size:.6em;display:grid;place-items:center;background:#140c2e;color:#fff;box-shadow:0 0 0 .12em var(--tc)}
.tk.charm{border-radius:.5em}
.tk.evo{box-shadow:0 0 0 .14em #ffd66a,0 0 .8em rgba(255,214,106,.8),inset 0 -.4em .6em rgba(0,0,0,.35)}
#combo{position:absolute;right:.8em;top:5.6em;text-align:right;font-weight:900;opacity:0;transition:opacity .3s;line-height:1}
#combo.on{opacity:1}
#combo b{display:block;font-size:1.9em;color:#fff;text-shadow:0 0 .35em #ff4d6d,0 .08em 0 rgba(0,0,0,.6)}
#combo span{font-size:.72em;color:#ffd6de;text-shadow:0 1px 3px #000}
#combo.pop b{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(1.45)}to{transform:scale(1)}}
#bossbar{position:absolute;left:1.4em;right:1.4em;top:9.6em;text-align:center}
#bossbar .bn{display:flex;justify-content:center;align-items:baseline;gap:.55em;font-weight:900;text-shadow:0 .1em .4em #000,0 0 .8em #000;margin-bottom:.3em}
#bossbar .bn b{font-family:var(--font-brush);font-weight:400;font-size:1.45em;color:#ffd2d2}
#bossbar .bn span{font-size:.85em}
#bossbar .bar{height:.7em;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
#bossbar .bar i{background:linear-gradient(90deg,#7a0e2a,#ff3d5a,#ffa36a);transition:width .12s}
#bossbar.shield .bar i{background:linear-gradient(90deg,#1a5a8a,#5fe3ff,#e0fbff)}

#dock{position:absolute;left:0;right:0;bottom:0;height:8.8em;padding:.55em .7em .75em;display:flex;flex-direction:column;gap:.5em;
  background:linear-gradient(180deg,rgba(243,211,138,.55) 0,rgba(243,211,138,.55) 1px,transparent 1px),
    radial-gradient(circle at 50% 100%,transparent 44%,rgba(243,211,138,.06) 45%,rgba(243,211,138,.06) 52%,transparent 53%,transparent 63%,rgba(243,211,138,.06) 64%,rgba(243,211,138,.06) 70%,transparent 71%) 0 0/2.4em 1.2em,
    linear-gradient(180deg,#1d1030,#0d0719);}
#xp{position:relative;height:1.15em;border-radius:1em;background:rgba(0,0,0,.5);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);overflow:hidden;flex:none}
#xp i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#3f6bff,#5fe3d0,#e4fdff);box-shadow:0 0 .7em #5fe3d0;transition:width .15s}
#xp.pulse i{filter:brightness(1.6)}
#xp span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000}
.ults{flex:1;display:flex;justify-content:center;align-items:center;gap:.4em;min-height:0}
.ult{pointer-events:auto;position:relative;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.18em;border-radius:1em}
.ult .ring{position:relative;width:4.3em;height:4.3em;border-radius:50%;background:conic-gradient(var(--hc) calc(var(--p,0)*1turn),rgba(255,255,255,.13) 0);display:grid;place-items:center;transition:transform .12s}
.ult .ring::before{content:'';position:absolute;inset:.26em;border-radius:50%;background:#140c2e}
.ult img{position:relative;width:3.78em;height:3.78em;border-radius:50%;filter:saturate(.55) brightness(.72);transition:filter .2s}
.ult .nm{font-size:.74em;font-weight:900;color:#fff;text-shadow:0 1px 3px #000}
.ult .tag{position:absolute;top:3.35em;left:50%;transform:translateX(-50%);font-size:.62em;font-weight:900;padding:.12em .55em;border-radius:1em;background:var(--hc);color:#140c2e;opacity:0;transition:opacity .2s;white-space:nowrap}
.ult.ready img{filter:none}
.ult.ready .tag{opacity:1}
.ult.ready .ring{animation:ready 1.1s ease-in-out infinite}
.ult.stun img{filter:grayscale(1) brightness(.5)}
.ult:active .ring{transform:scale(.93)}
@keyframes ready{0%,100%{box-shadow:0 0 .25em var(--hc)}50%{box-shadow:0 0 1.3em var(--hc),0 0 .4em #fff}}

/* ---------- banners & toasts ---------- */
#banner{position:absolute;left:0;right:0;top:31%;display:flex;flex-direction:column;align-items:center;pointer-events:none;opacity:0}
#banner.show{animation:banner 2.5s cubic-bezier(.2,.8,.2,1) forwards}
#banner .bk{font-family:var(--font-brush);font-size:3.3em;line-height:1;color:#fff;text-shadow:0 0 .3em var(--bc,#8a4dff),0 0 .9em var(--bc,#8a4dff),0 .06em 0 rgba(0,0,0,.6)}
#banner .bm{margin-top:.25em;font-weight:900;font-size:1.25em;color:#fff;padding:.28em 2em;background:linear-gradient(90deg,transparent,rgba(10,5,24,.82) 18%,rgba(10,5,24,.82) 82%,transparent)}
#banner .bs{margin-top:.35em;font-size:.86em;font-weight:700;color:#efe6ff;text-shadow:0 1px 3px #000,0 0 6px #000}
@keyframes banner{0%{opacity:0;transform:scale(1.3)}10%{opacity:1;transform:scale(1)}80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-.6em)}}
#toast{position:absolute;left:50%;bottom:10em;transform:translateX(-50%);padding:.55em 1em;border-radius:.8em;background:var(--chip);color:var(--chip-ink);font-weight:700;font-size:.85em;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;box-shadow:0 .2em .8em rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-.4em)}

/* ---------- modal & sheets ---------- */
#modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:1.1em;background:rgba(8,4,20,.64);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:5}
#modal.clear{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
.sheet{width:100%;max-height:100%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:1.15em;padding:1.25em 1.2em;box-shadow:var(--shadow),0 0 0 1px var(--edge-2);scrollbar-width:thin}
.sheet h2{margin:0;font-size:1.35em;font-weight:900;line-height:1.2}
.sheet .lede{margin:.35em 0 1em;color:var(--ink-2);font-size:.9em;line-height:1.5}
.sh-head{display:flex;align-items:center;gap:.7em;margin-bottom:.9em}
.sh-head .seal{flex:none}
.btn{border:0;cursor:pointer;border-radius:.85em;padding:.75em 1.05em;font-weight:900;background:var(--btn);color:var(--btn-ink);min-height:2.9em;line-height:1.1}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 .2em 0 rgba(0,0,0,.25)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge-2)}
.btn.big{font-size:1.12em;padding:.85em 1.2em}
.btn:disabled{opacity:.42;cursor:default}
.btn:not(:disabled):active{transform:translateY(1px)}
.row{display:flex;gap:.5em;flex-wrap:wrap;margin-top:.7em}
.row>.btn{flex:1}
.seal{width:2.6em;height:2.6em;border-radius:50%;display:grid;place-items:center;font-family:var(--font-brush);font-size:1.25em;line-height:1;color:#fff;background:var(--cc,#6b39d6);box-shadow:inset 0 0 0 .12em rgba(255,255,255,.45),inset 0 -.5em .8em rgba(0,0,0,.3);text-shadow:0 1px 2px rgba(0,0,0,.55)}

/* title */
.title{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto;grid-template-rows:1fr auto;padding:1.4em 1.25em 1.5em;pointer-events:none}
.title::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(10,5,24,.97) 0%,rgba(10,5,24,.82) 30%,rgba(10,5,24,0) 58%),linear-gradient(to left,rgba(10,5,24,.5),transparent 35%)}
.vt{position:relative;grid-column:2;grid-row:1;writing-mode:vertical-rl;font-family:var(--font-brush);font-size:5em;line-height:1.02;color:#f3d38a;text-shadow:0 0 .22em rgba(243,211,138,.5),0 .05em 0 #3b1a0e;align-self:start;margin-top:1.2em;animation:inkIn 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes inkIn{from{opacity:0;filter:blur(8px);transform:translateY(-.25em)}to{opacity:1;filter:none;transform:none}}
.tmain{position:relative;grid-column:1/3;grid-row:2;pointer-events:auto;color:#f3ecff}
.hanko{position:absolute;right:.1em;top:-4.2em;width:2.6em;height:2.6em;display:grid;place-items:center;font-family:var(--font-brush);font-size:1.25em;color:#fff3e8;background:#c9321f;border-radius:.3em;transform:rotate(-7deg);box-shadow:inset 0 0 0 .12em rgba(255,240,230,.55),0 .2em .6em rgba(0,0,0,.5);animation:stamp .5s .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{opacity:0;transform:scale(1.8) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(-7deg)}}
.tmain h1{margin:0;font-family:var(--font-brush);font-weight:400;font-size:2.7em;line-height:1;color:#fff}
.tmain p{margin:.45em 0 1em;color:#ddd1f6;font-size:.95em;line-height:1.5;max-width:23em}
.tmain .btn.primary{width:100%}
.tmain .btn.ghost{color:#f3ecff;box-shadow:inset 0 0 0 2px rgba(243,211,138,.35)}
.tmeta{margin-top:.85em;display:flex;justify-content:space-between;gap:1em;font-size:.8em;color:#cabfe6}
.savechip{margin:.45em 0 .1em;font-size:.8em;font-weight:700;color:#bff4e8;text-align:center}
.toggles{display:flex;gap:.4em;margin-top:.7em;flex-wrap:wrap}
.tog{pointer-events:auto;border:0;cursor:pointer;border-radius:2em;padding:.45em .8em;font-size:.78em;font-weight:700;background:rgba(255,255,255,.08);color:#e9e0ff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.tog[aria-pressed="true"]{background:rgba(95,227,208,.2);box-shadow:inset 0 0 0 1px rgba(95,227,208,.6);color:#fff}
.sheet .tog{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--edge-2)}
.sheet .tog[aria-pressed="true"]{background:var(--edge-2)}

/* level-up cards */
.lv{width:100%;display:flex;flex-direction:column;gap:.65em}
.lv-head{text-align:center;margin-bottom:.2em}
.lv-head b{display:block;font-family:var(--font-brush);font-weight:400;font-size:2.4em;line-height:1.05;color:#f3d38a;text-shadow:0 0 .35em rgba(243,211,138,.6)}
.lv-head span{font-weight:900;color:#fff;font-size:1.02em}
.lv-head small{font-weight:700;opacity:.75}
.card{position:relative;display:grid;grid-template-columns:3.4em 1fr;gap:.85em;align-items:center;width:100%;padding:.85em .95em;border:0;border-radius:1em;background:var(--panel-solid);color:var(--ink);text-align:left;cursor:pointer;box-shadow:inset 0 0 0 2px var(--cc),0 .35em 1.1em rgba(0,0,0,.4);animation:cardIn .42s cubic-bezier(.2,.9,.25,1.12) both;transition:transform .12s}
.card:nth-of-type(2){animation-delay:.07s}.card:nth-of-type(3){animation-delay:.14s}
.card:hover,.card:focus-visible{transform:translateY(-.14em)}
.card .seal{width:2.72em;height:2.72em;font-size:1.25em}
.card.charm .seal{border-radius:.55em}
.cb{display:flex;flex-direction:column;gap:.28em;min-width:0}
.ct{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.ct b{font-size:1.02em;font-weight:900}
.ct em{font-style:normal;font-size:.72em;font-weight:900;padding:.1em .55em;border-radius:1em;background:var(--cc);color:#150b2c}
.cd{font-size:.84em;line-height:1.4;color:var(--ink-2)}
.pips{display:flex;gap:.2em}
.pips i{width:.95em;height:.32em;border-radius:.2em;background:var(--track)}
.pips i.on{background:var(--cc)}
.pips i.nx{background:var(--cc);animation:blink .7s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.25}to{opacity:1}}
.card.evo{background:linear-gradient(var(--panel-solid),var(--panel-solid)) padding-box,linear-gradient(115deg,#ffd66a,#ff6b4a,#fff3c2,#8a4dff,#ffd66a) border-box;background-size:auto,320% 100%;border:.16em solid transparent;box-shadow:0 0 1.4em rgba(255,214,106,.55);animation:cardIn .42s both,shine 2.4s linear infinite}
@keyframes shine{to{background-position:0 0,320% 0}}
@keyframes cardIn{from{opacity:0;transform:translateY(1.1em) scale(.97)}to{opacity:1;transform:none}}
.lv .btn.ghost{color:#f3ecff;box-shadow:inset 0 0 0 2px rgba(243,211,138,.35);background:rgba(10,5,24,.4)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:2.6em 1fr auto;gap:.75em;align-items:center;padding:.65em 0;border-bottom:1px solid var(--edge-2)}
.li:last-child{border-bottom:0}
.li .seal{width:2.1em;height:2.1em;font-size:1.25em}
.li .nm{font-weight:900;font-size:.95em}
.li .ds{font-size:.8em;color:var(--ink-2);line-height:1.4;margin-top:.1em}
.li .pp{display:flex;gap:.18em;margin-top:.3em}
.li .pp i{width:.8em;height:.3em;border-radius:.2em;background:var(--track)}
.li .pp i.on{background:var(--gold)}
.li .btn{min-height:2.4em;padding:.5em .8em;font-size:.82em;white-space:nowrap}
.sec{margin:1.1em 0 .3em;font-size:.85em;font-weight:900;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin:.9em 0}
.stat{border-radius:.8em;padding:.6em .5em;text-align:center;box-shadow:inset 0 0 0 2px var(--edge-2)}
.stat b{display:block;font-size:1.25em;font-weight:900}
.stat span{font-size:.72em;color:var(--ink-2)}
.dmg{display:flex;flex-direction:column;gap:.45em}
.dr{display:grid;grid-template-columns:7.4em 1fr 3.2em;gap:.5em;align-items:center;font-size:.8em}
.dr span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.dr .db{height:.55em;border-radius:1em;background:var(--track);overflow:hidden}
.dr .db i{display:block;height:100%;border-radius:inherit;background:var(--cc)}
.dr span:last-child{text-align:right;font-weight:900}
.res-k{font-family:var(--font-brush);font-size:2.6em;line-height:1;color:var(--edge)}
.help p{margin:.5em 0;line-height:1.55;font-size:.9em}
.help b{font-weight:900}
.kbd{display:inline-block;padding:0 .4em;border-radius:.35em;box-shadow:inset 0 0 0 1.5px var(--edge-2);font-weight:900;font-size:.85em}

@media (prefers-reduced-motion:reduce){
  #banner.show{animation:bannerFade 2.5s linear forwards}
  @keyframes bannerFade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
  .card,.card.evo,.vt,.hanko{animation:none}
  .ult.ready .ring{animation:none;box-shadow:0 0 1em var(--hc)}
  .pips i.nx{animation:none}
}
</style>
</head>

<canvas id="cv" role="img" aria-label="Snack Attack battlefield"></canvas>

  <div class="top">
    <button class="ibtn chip" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button>

'use strict';
/* ============ Night Parade: core ============ */
const W = 720, H = 1280, CX = 360;
const FIELD_TOP = 196, BARRIER_Y = 928, HERO_Y = 1062;
const TOTAL_WAVES = 30;
const TAU = Math.PI * 2;
const $ = id => document.getElementById(id);
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;
const easeBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function wpick(list) { let s = 0; for (const it of list) s += it.w; let r = Math.random() * s; for (const it of list) { r -= it.w; if (r <= 0) return it; } return list[list.length - 1]; }
function fmt(n) { n = Math.round(n); if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + 'M'; if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + 'K'; return String(n); }
const KNUM = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
function kanjiNum(n) { if (n <= 0) return '〇'; if (n >= 100) return String(n); const t = Math.floor(n / 10), o = n % 10; return (t ? (t > 1 ? KNUM[t] : '') + '十' : '') + KNUM[o]; }

const _rgb = {};
function rgb(hex) { let c = _rgb[hex]; if (c) return c; let h = hex.replace('#', ''); if (h.length === 3) h = h.split('').map(x => x + x).join(''); const n = parseInt(h, 16); c = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _rgb[hex] = c; return c; }
function rgba(hex, a) { const c = rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
function mix(h1, h2, t) { const a = rgb(h1), b = rgb(h2); const r = Math.round(lerp(a[0], b[0], t)), g = Math.round(lerp(a[1], b[1], t)), bl = Math.round(lerp(a[2], b[2], t)); return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1); }

/* perspective of the shrine approach: narrow at the demon gate, wide at the barrier */
const depthT = y => clamp((y - FIELD_TOP) / (BARRIER_Y - FIELD_TOP), 0, 1);
const depthS = y => 0.64 + 0.36 * depthT(y);
const halfW = y => 205 + 130 * depthT(y);
const laneX = (u, y) => CX + u * halfW(y);

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }

/* cached additive glow sprites */
const _glow = new Map();
function glowSprite(color, core = true) {
  const key = color + (core ? '1' : '0');
  let c = _glow.get(key); if (c) return c;
  c = mkCanvas(64, 64); const g = c.getContext('2d');
  const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  if (core) { gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.15, rgba(color, 1)); gr.addColorStop(0.42, rgba(color, 0.36)); gr.addColorStop(1, rgba(color, 0)); }
  else { gr.addColorStop(0, rgba(color, 0.85)); gr.addColorStop(0.45, rgba(color, 0.32)); gr.addColorStop(1, rgba(color, 0)); }
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); _glow.set(key, c); return c;
}
function glow(ctx, color, x, y, r, a = 1, core = true) { if (a <= 0.004 || r <= 0.5) return; ctx.globalAlpha = a > 1 ? 1 : a; ctx.drawImage(glowSprite(color, core), x - r, y - r, r * 2, r * 2); }

    return '<div class="hc' + (sel ? ' sel' : '') + (open ? '' : ' locked') + '" style="--hc:' + H.color + '"><img alt="" src="' + heroPortrait(id) + '"><b>' + H.name + '</b><span>' + H.basic.icon + ' ' + H.basic.name + ', ' + basicReachLabel(H.basic.reach).toLowerCase() + '</span><span class="hu">' + H.ult.name + '</span>' +
      (open ? (sel ? '<em>Selected</em>' : '<button type="button" class="btn ghost" data-a="hero-pick" data-h="' + id + '">Pick</button>')
        : '<span class="hr">' + req + '</span><button type="button" class="btn ghost" data-a="hero-buy" data-h="' + id + '"' + (SAVE.mon < H.unlock.cost ? ' disabled' : '') + '>Buy ' + H.unlock.cost + '</button>') + '</div>';
  }).join('') + '</div>';
}
function heroInfo(id) { const H = HERO_LIST[id]; return H.attack + ' Ultimate: ' + H.ult.name + '. ' + H.ult.desc; }
function pickHero(id) { if (!heroUnlocked(id)) return; SAVE.hero = id; persist(); Sound.play('pick'); toast(HERO_LIST[id].name + ': ' + HERO_LIST[id].basic.name); showCrew(); }
function buyHero(id) {
  const H = HERO_LIST[id]; if (!H || heroUnlocked(id) || SAVE.mon < H.unlock.cost) { Sound.play('error'); return; }
  SAVE.mon -= H.unlock.cost; SAVE.heroes[id] = true; SAVE.hero = id; persist(); Sound.play('evo'); toast(H.name + ' joins the kitchen!'); checkAch(); showCrew();
}

/* ---------- boss rush ---------- */
function rushUnlocked() { return !!SAVE.chapters.cleared[2]; }
function beginBossRush() {
  if (!rushUnlocked()) return;
  Sound.init(); Sound.setMuted(false); clearRun();
  newRun(false, 0, true); G.cracks = makeCracks(); G.rushBonus = false;
  G.startPick = 3 + mlv('head');
  UI.hud.classList.remove('hidden'); UI.bossbar.classList.add('hidden');
  for (const k in HUDC) delete HUDC[k];
  refreshHeroUI(); renderTechRow(); updateHUD();
  SAVE.runs++; persist();
  openCards(true);
}
function showRushResults(kind) {
  const victory = kind === 'victory', beaten = victory ? G.maxWave : Math.max(0, G.wave - 1);
  const firstWin = victory && !SAVE.seen.rushWin, reward = victory ? Math.round(BOSSRUSH.reward * (firstWin ? 1 : 0.3)) : beaten * 40;
  const HX = grantHeroXP(beaten * 3, victory);
  const earned = Math.max(0, Math.round(G.mon - G.monBanked)) + reward; G.monBanked = G.mon;
  SAVE.mon += earned; if (victory) SAVE.seen.rushWin = 1;
  const newBest = beaten > (SAVE.rushBest || 0); SAVE.rushBest = Math.max(SAVE.rushBest || 0, beaten);
  SAVE.run = null; persist(); checkAch();
  UI.hud.classList.add('hidden');
  G.lastResults = '<div class="sheet" role="dialog" aria-label="Boss rush results">' +
    '<div class="sh-head"><span class="res-k" aria-hidden="true">' + (victory ? '完勝' : '連戦') + '</span><div><h2>' + (victory ? 'Boss rush complete!' : beaten + ' of ' + G.maxWave + ' bosses beaten') + '</h2><div class="lede" style="margin:.25em 0 0">' + (newBest ? 'A new best. ' : '') + 'You earned ' + earned + ' coins' + (reward ? ', including a ' + reward + ' coin ' + (firstWin ? 'first clear ' : '') + 'reward' : '') + '.</div></div></div>' +
    heroXPLine(HX) +
    '<div class="stats"><div class="stat"><b>' + beaten + '/' + G.maxWave + '</b><span>Bosses beaten</span></div><div class="stat"><b>' + G.level + '</b><span>Level reached</span></div><div class="stat"><b>' + (SAVE.rushBest || 0) + '</b><span>Best ever</span></div></div>' +
    '<div class="row"><button type="button" class="btn primary" data-a="rush">Try again</button><button type="button" class="btn ghost" data-a="start">Chapters</button><button type="button" class="btn ghost" data-a="quit">Title</button></div></div>';
  showModal(G.lastResults);
}

/* ---------- stars ---------- */
function starCount(m) { return (m & 1) + ((m >> 1) & 1) + ((m >> 2) & 1); }
function starsHTML(bits, fresh) {
  return '<div class="stars3">' + STAR_GOALS.map((g, i) => '<div class="st3' + (bits & (1 << i) ? ' on' : '') + '"><b>' + (bits & (1 << i) ? '★' : '☆') + '</b><span>' + g + '</span></div>').join('') + '</div>' +
    (fresh ? '<div class="ds" style="text-align:center;margin:-.2em 0 .5em">' + fresh + ' new star' + (fresh > 1 ? 's' : '') + '! Bonus coins added.</div>' : '');
}
function starStr(m) { let o = ''; for (let i = 0; i < 3; i++) o += '<i class="' + (m & (1 << i) ? 'on' : '') + '">★</i>'; return '<span class="chstars" aria-label="' + starCount(m) + ' of 3 stars">' + o + '</span>'; }

/* ---------- hero levels ---------- */
function grantHeroXP(reached, victory) {
  if (G.demo) return null;
  SAVE.hlv = SAVE.hlv || {};
  const id = G.heroId || 'yilang', before = SAVE.hlv[id] || 0;
  const xp = Math.round(reached * 20 + G.stats.bosses * 100 + (victory ? 200 : 0) + G.stats.kills / 5);
  SAVE.hlv[id] = before + xp;
  const l0 = heroLevelOf(before), l1 = heroLevelOf(before + xp);
  return { id, xp, l0, l1 };
}
function heroXPLine(HX) {
  if (!HX) return '';
  const H = HERO_LIST[HX.id], up = HX.l1 > HX.l0;
  const perks = []; for (let l = HX.l0 + 1; l <= HX.l1; l++) if (HERO_PERKS[l]) perks.push(HERO_PERKS[l]);
  return '<div class="hxp' + (up ? ' up' : '') + '"><img alt="" src="' + heroPortrait(HX.id) + '"><div><b>' + H.name + ' +' + HX.xp + ' XP</b><span>' + (up ? 'Level ' + HX.l1 + '! ' + perks.join('. ') : 'Level ' + HX.l1 + (HX.l1 < 8 ? ', ' + (HERO_XP[HX.l1] - (SAVE.hlv[HX.id] || 0)) + ' XP to level ' + (HX.l1 + 1) : ' (max)')) + '</span></div></div>';
}

/* ---------- kitchen crew: heroes, outfits, pets ---------- */
function crewLine() {
  const H = HERO_LIST[heroUnlocked(SAVE.hero) ? SAVE.hero : 'yilang'], P = SAVE.pet && SAVE.pets && SAVE.pets[SAVE.pet] ? PETS[SAVE.pet] : null;
  return '<div class="crewline"><img alt="" src="' + heroPortrait(H.id) + '"><div><b>' + H.name + ', level ' + heroLevelOf((SAVE.hlv || {})[H.id] || 0) + '</b><span>' + H.basic.icon + ' ' + H.basic.name + (P ? ' and ' + P.icon + ' ' + P.name : '') + '</span></div><button type="button" class="btn ghost" data-a="crew">Change</button></div>';
}
function showCrew() {
  SAVE.outfit = SAVE.outfit || {}; SAVE.pets = SAVE.pets || {};
  const sel = heroUnlocked(SAVE.hero) ? SAVE.hero : 'yilang', H = HERO_LIST[sel], xp = (SAVE.hlv || {})[sel] || 0, lv = heroLevelOf(xp);
  const nextXP = HERO_XP[lv] || null, prevXP = HERO_XP[lv - 1] || 0, pct = nextXP ? (xp - prevXP) / (nextXP - prevXP) : 1;
  const perks = HERO_PERKS.map((p, l) => p ? '<li class="' + (lv >= l ? 'on' : '') + '"><b>Lv ' + l + '</b> ' + p + '</li>' : '').join('');
  const outfits = OUTFITS[sel].map(o => {
    const owned = o.cost === 0 || (SAVE.outfit['own_' + sel + '_' + o.id]), on = (SAVE.outfit[sel] || 'classic') === o.id;
    return '<button type="button" class="of' + (on ? ' on' : '') + '" data-a="outfit" data-h="' + sel + '" data-o="' + o.id + '"' + (!owned && SAVE.mon < o.cost ? ' disabled' : '') + '><i style="background:' + o.sw + '"></i><b>' + o.name + '</b><span>' + (on ? 'Wearing' : owned ? 'Wear' : 'Buy ' + o.cost) + '</span></button>';
  }).join('');
  const pets = '<button type="button" class="of' + (!SAVE.pet ? ' on' : '') + '" data-a="pet" data-p=""><i class="emo">🚫</i><b>No pet</b><span>' + (!SAVE.pet ? 'Selected' : 'Pick') + '</span></button>' + PET_IDS.map(id => {
    const P = PETS[id], owned = !!SAVE.pets[id], on = SAVE.pet === id;
    return '<button type="button" class="of' + (on ? ' on' : '') + '" data-a="pet" data-p="' + id + '"' + (!owned && SAVE.mon < P.cost ? ' disabled' : '') + '><i class="emo">' + P.icon + '</i><b>' + P.name + '</b><span class="pd">' + P.desc + '</span><span>' + (on ? 'Following you' : owned ? 'Pick' : 'Buy ' + P.cost) + '</span></button>';
  }).join('');
  showModal('<div class="sheet" role="dialog" aria-label="Kitchen crew">' +
    '<div class="sh-head"><span class="seal emo" style="--cc:#c93a26">🧑‍🍳</span><div><h2>Kitchen crew</h2><div class="lede" style="margin:0">You have <b>' + fmt(SAVE.mon) + ' coins</b>. Heroes level up as you play them.</div></div></div>' +
    heroPickerHTML() +
    '<div class="sec">' + H.name + ', level ' + lv + '</div><div class="hbar"><i style="width:' + (pct * 100).toFixed(1) + '%"></i></div><div class="ds">' + (nextXP ? (nextXP - xp) + ' XP to level ' + (lv + 1) : 'Max level') + '. ' + heroInfo(sel) + '</div><ul class="perks">' + perks + '</ul>' +
    '<div class="sec">Outfits</div><div class="ofs">' + outfits + '</div>' +
    '<div class="sec">Pet</div><div class="ofs pets">' + pets + '</div>' +
    '<div class="row"><button type="button" class="btn primary" data-a="' + (G.crewFrom === 'chapters' ? 'start' : 'back') + '">Done</button></div></div>');
}
function pickOutfit(h, o) {
  const O = OUTFITS[h].find(x => x.id === o); if (!O) return;
  const key = 'own_' + h + '_' + o;
  if (O.cost > 0 && !SAVE.outfit[key]) { if (SAVE.mon < O.cost) { Sound.play('error'); return; } SAVE.mon -= O.cost; SAVE.outfit[key] = true; toast('New outfit: ' + O.name); }
  SAVE.outfit[h] = o; persist(); Sound.play('pick'); showCrew();
}
function pickPet(id) {
  if (id && !SAVE.pets[id]) { const P = PETS[id]; if (SAVE.mon < P.cost) { Sound.play('error'); return; } SAVE.mon -= P.cost; SAVE.pets[id] = true; toast(P.name + ' joins the crew!'); }
  SAVE.pet = id || null; persist(); Sound.play('pick'); showCrew();
}

/* ---------- daily challenge ---------- */
function dayKey(d) { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function yesterdayKey() { const d = new Date(); d.setDate(d.getDate() - 1); return dayKey(d); }
function dailyState() { const k = dayKey(); SAVE.daily = SAVE.daily || {}; if (SAVE.daily.key !== k) { SAVE.daily.key = k; SAVE.daily.best = 0; SAVE.daily.won = false; } return SAVE.daily; }
function dailyCardHTML() {
  if (!SAVE.chapters.cleared[0]) return '<div class="chc locked" style="--ct:#2fc0a0"><div class="chi emo">🔒</div><div class="chb"><div class="chn"><span class="chk">日替</span><b>Daily challenge</b></div><div class="chs">Clear chapter 1 to unlock</div></div></div>';
  const D = makeDaily(dayKey()), S = dailyState(), H = HERO_LIST[D.hero];
  return '<div class="chc daily" style="--ct:#2fc0a0"><div class="chi emo">🗓️</div><div class="chb"><div class="chn"><span class="chk">日替</span><b>Daily challenge</b>' + (S.won ? '<span class="chok">✓</span>' : '') + '</div>' +
    '<div class="chm">20 waves, playing as ' + H.name + '</div><div class="chr">' + D.rule + '</div>' +
    '<div class="chs">' + (S.best ? 'Today\u2019s best: ' + fmt(S.best) + ' points' : 'Not played today') + (SAVE.daily.streak ? ', streak ' + SAVE.daily.streak + ' day' + (SAVE.daily.streak > 1 ? 's' : '') : '') + (S.won ? '' : ', first win pays ' + (400 + Math.min(500, 50 * (SAVE.daily.lastWin === yesterdayKey() ? (SAVE.daily.streak || 0) : 0))) + ' coins') + '</div></div>' +
    '<button type="button" class="btn ghost chp" data-a="daily">Play</button></div>';
}
function beginDaily() {
  Sound.init(); Sound.setMuted(false); clearRun();
  newRun(false, 0, false, makeDaily(dayKey())); G.cracks = makeCracks(); recalc();
  G.startPick = 1 + mlv('head');
  UI.hud.classList.remove('hidden'); UI.bossbar.classList.add('hidden');
  for (const k in HUDC) delete HUDC[k];
  refreshHeroUI(); renderTechRow(); updateHUD();
  SAVE.runs++; persist();
  openCards(true);
}
function showDailyResults(kind) {
  const victory = kind === 'victory', S = dailyState(), cleared = victory ? G.maxWave : Math.max(0, G.wave - 1);
  const score = cleared * 1000 + G.stats.kills, newBest = score > (S.best || 0); S.best = Math.max(S.best || 0, score);
  let reward = 0;
  if (victory && !S.won) { S.won = true; SAVE.daily.streak = SAVE.daily.lastWin === yesterdayKey() ? (SAVE.daily.streak || 0) + 1 : 1; SAVE.daily.lastWin = dayKey(); reward = 400 + Math.min(500, 50 * (SAVE.daily.streak - 1)); }
  const HX = grantHeroXP(cleared, victory);
  const earned = Math.max(0, Math.round(G.mon - G.monBanked)) + reward; G.monBanked = G.mon; SAVE.mon += earned;
  SAVE.run = null; persist(); checkAch(); UI.hud.classList.add('hidden');
  G.lastResults = '<div class="sheet" role="dialog" aria-label="Daily challenge results">' +
    '<div class="sh-head"><span class="res-k" aria-hidden="true">日替</span><div><h2>' + (victory ? 'Daily challenge cleared!' : 'Daily challenge over on wave ' + G.wave) + '</h2><div class="lede" style="margin:.25em 0 0">' + (newBest ? 'New best for today. ' : '') + 'You earned ' + earned + ' coins' + (reward ? ', including a ' + reward + ' coin daily reward (streak: ' + SAVE.daily.streak + ')' : '') + '.</div></div></div>' +
    heroXPLine(HX) +
    '<div class="stats"><div class="stat"><b>' + fmt(score) + '</b><span>Score</span></div><div class="stat"><b>' + fmt(S.best) + '</b><span>Today\u2019s best</span></div><div class="stat"><b>' + (SAVE.daily.streak || 0) + '</b><span>Win streak</span></div></div>' +
    '<div class="ds" style="text-align:center;margin:.3em 0">A new challenge arrives every day at midnight.</div>' +
    '<div class="row"><button type="button" class="btn primary" data-a="daily">Try again</button><button type="button" class="btn ghost" data-a="start">Chapters</button><button type="button" class="btn ghost" data-a="quit">Title</button></div></div>';
  showModal(G.lastResults);
}

/* ---------- story scenes ---------- */
let _story = null;
function storyFace(who) {
  if (HERO_LIST[who]) return '<img class="sf hero" alt="" src="' + heroPortrait(who) + '">';
  return '<img class="sf veg" alt="" src="' + dexThumb(who, true) + '">';
}
function showStory(scene, then) {
  _story = { scene, then, i: 0 }; renderStory();
}
function renderStory() {
  const S = _story.scene, P = S.panels[_story.i], who = P[0], name = HERO_LIST[who] ? HERO_LIST[who].name : ENEMIES[who].name, last = _story.i >= S.panels.length - 1;
  const left = !!HERO_LIST[who];
  showModal('<div class="sheet story" role="dialog" aria-label="Story: ' + S.title + '">' +
    '<div class="sty-t">' + S.title + '</div>' +
    '<div class="sty-p' + (left ? '' : ' r') + '">' + storyFace(who) + '<div class="bub"><b>' + name + '</b><p>' + P[1] + '</p></div></div>' +
    '<div class="sty-d">' + S.panels.map((_, i) => '<i class="' + (i === _story.i ? 'on' : '') + '"></i>').join('') + '</div>' +
    '<div class="row"><button type="button" class="btn ghost" data-a="story-skip">Skip</button><button type="button" class="btn primary" data-a="story-next">' + (last ? 'Let\u2019s go!' : 'Next') + '</button></div></div>');
}
function storyNext(skip) {
  if (!_story) return;
  if (!skip && _story.i < _story.scene.panels.length - 1) { _story.i++; Sound.play('click'); renderStory(); return; }
  const then = _story.then; _story = null; Sound.play('pick'); if (then) then();
}
function playChapter(ch) {
  SAVE.story = SAVE.story || {};
  if (SAVE.settings.story !== false && !SAVE.story[ch] && STORY[ch]) { SAVE.story[ch] = 1; persist(); showStory(STORY[ch], () => beginRun(ch)); return; }
  beginRun(ch);
}
/* ============ Night Parade: boot & loop ============ */
let lastT = 0, perfAcc = 0, perfN = 0, resizeTimer = 0;
function resize() {
  const app = $('app'), stage = $('stage');
  const aw = app.clientWidth || window.innerWidth, ah = app.clientHeight || window.innerHeight;
  let sw = aw, sh = aw * H / W; if (sh > ah) { sh = ah; sw = ah * W / H; }
  sw = Math.max(200, Math.floor(sw)); sh = Math.max(356, Math.floor(sh));
  stage.style.width = sw + 'px'; stage.style.height = sh + 'px'; stage.style.fontSize = (sw / 36) + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, SAVE.settings.quality === 'low' ? 1 : 2);
  SCALE = sw / W;
  cv.width = Math.round(sw * DPR); cv.height = Math.round(sh * DPR);
  buildBG();
}
function perfTrack(dt) {
  perfAcc += dt; perfN++;
  if (perfN >= 90) {
    const avg = perfAcc / perfN;
    const qs = SAVE.settings.quality || 'auto';
    if (qs === 'high') G.q = 1; else if (qs === 'low') G.q = 0.45;
    else if (avg > 1 / 40 && G.q > 0.45) G.q = Math.max(0.45, G.q - 0.15);
    else if (avg < 1 / 55 && G.q < 1) G.q = Math.min(1, G.q + 0.05);
    perfAcc = 0; perfN = 0;
  }
}
function step(dt) {
  realFx(dt);
  if (G.mode === 'play' || G.mode === 'title' || G.mode === 'ending') {
    let sim = dt * timeScale() * (G.mode === 'play' ? G.speed : 1), guard = 0;
    while (sim > 1e-5 && guard++ < 8) { const st = Math.min(sim, 1 / 50); update(st); sim -= st; }
    if (G.mode === 'play') postUpdate();
  }
  if (G.mode === 'ending' && G.ending) {
    G.ending.t += dt;
    if (G.ending.kind === 'victory') G.dawn = Math.min(1, G.ending.t / 3);
    if (G.ending.t > (G.ending.kind === 'victory' ? 3.6 : 2.8)) { const kind = G.ending.kind; G.mode = 'over'; showResults(kind); }
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  if (!(dt > 0)) dt = 1 / 60; dt = Math.min(dt, 0.05);
  perfTrack(dt);
  step(dt);
  render();
  uiTick(dt);
}
function init() {
  cv = $('cv'); ctx = cv.getContext('2d');
  resize();
  loadFace();
  buildUI();
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });
  newRun(true); setupDemo(); showTitle();
  lastT = performance.now();
  requestAnimationFrame(frame);
}
init();
window.__NP = { G, step, update, render, newRun, startWave, castUlt, applyCard, rollCards, autoPick, openCards, pickCard, beginRun, showResults, setupDemo, toTitle, getSave: () => SAVE };

function applyQuality() { const q = SAVE.settings.quality || 'auto'; G.q = q === 'low' ? 0.45 : 1; try { window.dispatchEvent(new Event('resize')); } catch (e) { /* ignore */ } }

</script>
